<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="LittleSteps">
  <defs>
    <linearGradient id="ls-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB3B3"/>
      <stop offset="1" stop-color="#F08287"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#ls-bg)"/>
  <!-- Three ascending steps: the name, drawn. Rounded caps keep it soft at
       16px, where a footprint or a face turns to mush. -->
  <g fill="#FFFFFF">
    <rect x="104" y="300" width="92" height="108" rx="30"/>
    <rect x="210" y="240" width="92" height="168" rx="30"/>
    <rect x="316" y="180" width="92" height="228" rx="30"/>
    <circle cx="362" cy="118" r="34" fill="#FFFFFF" opacity="0.92"/>
  </g>
</svg>
