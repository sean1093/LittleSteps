<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="mask-icon" href="/mask-icon.svg" color="#F08287" />
    <!-- `maximum-scale=1, user-scalable=no` used to be here. Pinch-zoom is how
         a tired parent reads small print at 2am, and blocking it fails WCAG
         1.4.4. Nothing in the layout depends on it being off. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FDFBF7" />
    <meta name="description" content="從懷孕、新生兒到 1-3 歲幼兒，四個服務陪台灣爸媽走過每個階段" />

    <!-- Open Graph / Facebook.
         These pointed at sean1093.github.io, which is not where this deploys;
         the app is on Firebase Hosting, so every shared link showed a broken
         preview even before the missing image. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://littlesteps-c6ab6.web.app/" />
    <meta property="og:title" content="LittleSteps - 孕期到幼兒的育兒陪伴" />
    <meta property="og:description" content="從懷孕、新生兒到 1-3 歲幼兒，四個服務陪台灣爸媽走過每個階段" />
    <meta property="og:image" content="https://littlesteps-c6ab6.web.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="zh_TW" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://littlesteps-c6ab6.web.app/" />
    <meta property="twitter:title" content="LittleSteps - 孕期到幼兒的育兒陪伴" />
    <meta property="twitter:description" content="從懷孕、新生兒到 1-3 歲幼兒，四個服務陪台灣爸媽走過每個階段" />
    <meta property="twitter:image" content="https://littlesteps-c6ab6.web.app/og-image.png" />

    <!-- Apple Web App -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LittleSteps" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>LittleSteps - 孕期到幼兒的育兒陪伴</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
